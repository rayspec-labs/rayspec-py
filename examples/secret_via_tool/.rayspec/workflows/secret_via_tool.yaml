# yaml-language-server: $schema=https://raw.githubusercontent.com/rayspec-labs/rayspec-py/main/schemas/workflow.schema.json
rayspec: 1
name: secret_via_tool
description: Give an agent a capability, not a credential — the secret stays in a shell tool.
isolation: none

inputs:
  repo:
    type: string
    default: rayspec-labs/rayspec-py
    description: owner/name of the repository to triage

agents:
  triager:
    provider: claude
    model: sonnet
    access: read-only
    instructions: You triage GitHub issues. You never ask for credentials.

steps:
  # THE TOOL. The only place the credential exists: `GITHUB_TOKEN` comes from the
  # `secrets:` block in .rayspec/config.yaml and is handed to this step — and only to
  # shell:/python: steps — as an environment variable. It exposes a *capability*
  # ("the open issues of this repo"), never the key itself.
  - id: open_issues
    shell: |
      set -euo pipefail
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo '{"authenticated": false, "issues": []}'
        exit 0
      fi
      issues=$(curl -sS --fail-with-body \
        -H "Authorization: Bearer $GITHUB_TOKEN" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/${REPO}/issues?state=open&per_page=20")
      printf '{"authenticated": true, "issues": %s}\n' \
        "$(printf '%s' "$issues" | python3 -c 'import json,sys; print(json.dumps([{"number": i["number"], "title": i["title"]} for i in json.load(sys.stdin) if "pull_request" not in i]))')"
    env:
      REPO: "{{ inputs.repo }}"
    output_schema:
      type: object
      required: [authenticated, issues]
      properties:
        authenticated: { type: boolean }
        issues:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              title: { type: string }

  # THE AGENT. It sees the capability's result — issue numbers and titles — and nothing
  # else. The transcript under RAYSPEC_HOME therefore holds no credential at all.
  - id: triage
    needs: [open_issues]
    agent: triager
    when: "steps.open_issues.output.authenticated"
    prompt: |
      Group these open issues of {{ inputs.repo }} into at most three themes and name the
      one to tackle first. Answer in at most six lines.

      {{ steps.open_issues.output.issues | tojson }}

outputs:
  authenticated: "{{ steps.open_issues.output.authenticated }}"
  themes: "{{ steps.triage.output | default('') }}"
