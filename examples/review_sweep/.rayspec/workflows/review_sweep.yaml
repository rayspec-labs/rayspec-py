# yaml-language-server: $schema=https://raw.githubusercontent.com/rayspec-labs/rayspec-py/main/schemas/workflow.schema.json
rayspec: 1
name: review_sweep
description: >
  Review one change from three independent angles in a single pass, keep the reports as run
  artifacts, and let the other angles finish when one of them fails.

inputs:
  target: { type: string, default: "src/", description: "File or directory under review" }

isolation: none                     # every step only reads the checkout

defaults:
  agent: reviewer
  max_parallel: 3
  timeout: 5m
  on_step_failure: continue         # a failed branch does not stop the ones beside it

agents:
  reviewer:
    provider: claude
    model: small
    access: read-only
    instructions: You are a terse reviewer. Findings only — never rewrites, never praise.

steps:
  - id: collect
    shell: ls -1 "{{ inputs.target }}"

  # Three angles on the same change. They share one input and nothing else, which is what makes
  # `on_step_failure: continue` the right policy: one of them failing says nothing about the
  # other two, and a run that stopped there would have to be started again to learn the rest.
  - id: api
    needs: [collect]
    prompt: |
      Files under review:
      {{ steps.collect.output }}

      Angle: the public API. Does anything change what a caller sees? At most five findings.
  - id: api_report
    needs: [api]
    shell: |
      mkdir -p reports
      printf '%s\n' "{{ steps.api.output }}" > reports/api.md
    artifacts: [reports/api.md]      # the promise: written, hashed and kept with the run

  - id: docs
    needs: [collect]
    prompt: |
      Files under review:
      {{ steps.collect.output }}

      Angle: the documentation. What is now wrong or missing? At most five findings.
  - id: docs_report
    needs: [docs]
    shell: |
      mkdir -p reports
      printf '%s\n' "{{ steps.docs.output }}" > reports/docs.md
    artifacts: [reports/docs.md]

  - id: tests
    needs: [collect]
    prompt: |
      Files under review:
      {{ steps.collect.output }}

      Angle: the tests. Which behaviour is unverified? At most five findings.
  - id: tests_report
    needs: [tests]
    shell: |
      mkdir -p reports
      printf '%s\n' "{{ steps.tests.output }}" > reports/tests.md
    artifacts: [reports/tests.md]

  - id: digest
    needs: [api_report, docs_report, tests_report]
    join: always                    # finally-semantics: say what the sweep learned, whatever failed
    prompt: |
      Three angles were attempted. Summarise the ones that answered in at most five lines and
      name the ones that did not.

      api ({{ steps.api.status }}){% if steps.api.status == 'succeeded' %}:
      {{ steps.api.output }}{% endif %}

      docs ({{ steps.docs.status }}){% if steps.docs.status == 'succeeded' %}:
      {{ steps.docs.output }}{% endif %}

      tests ({{ steps.tests.status }}){% if steps.tests.status == 'succeeded' %}:
      {{ steps.tests.output }}{% endif %}

outputs:
  digest: "{{ steps.digest.output }}"
  answered: "{{ [steps.api.status, steps.docs.status, steps.tests.status] | select('equalto', 'succeeded') | list | length }}"
  reports: "{{ [steps.api_report.status, steps.docs_report.status, steps.tests_report.status] | select('equalto', 'succeeded') | list | length }}"
