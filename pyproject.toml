[project]
name = "rayspec"
version = "1.0.3"
description = "Declarative agent workflows for coding agents (Claude Agent SDK + OpenAI Codex SDK). CLI only."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "rayspec-labs" }]
keywords = ["agents", "workflows", "claude", "codex", "cli", "yaml"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]

dependencies = [
  "claude-agent-sdk>=0.2.142",
  "openai-codex>=0.147.0",
  "pydantic>=2.12",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "anyio>=4.4",
  "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/rayspec-labs/rayspec-py"
Repository = "https://github.com/rayspec-labs/rayspec-py"
Changelog = "https://github.com/rayspec-labs/rayspec-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/rayspec-labs/rayspec-py/issues"

[project.scripts]
rayspec = "rayspec.cli.app:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "types-PyYAML",
  "types-jsonschema",
  "hatchling>=1.27",  # dev-only: tests/cli/test_init_cmd.py builds a wheel in-process
]
# dev-only: the published docs site is these same `docs/*.md`. `uv run --group docs mkdocs serve`
# previews them; `tests/release/test_docs_site.py` builds them with `--strict`, which is what
# proves every internal link resolves in the site as well as on GitHub.
docs = [
  # Upper bounds on purpose: MkDocs 2.0 drops the plugin and theming systems Material builds on,
  # so an unpinned resolve would break the docs build on a day nobody was touching the docs.
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 list-form `license-files` (metadata 2.4+)
build-backend = "hatchling.build"

# A checkout that has been *used* is not a clean checkout: `rayspec run` leaves run records,
# `rayspec trust add` writes a `trusted.yaml`, `rayspec lock` writes a `rayspec.lock`, a coding
# agent leaves a `.claude/`, and the release job writes the bill of materials into `provenance/`.
# The release publishes the sdist as well as the wheel and a published artefact cannot be recalled,
# so the deny-list below applies to both targets rather than trusting the tree it is built from.
# A pre-seeded `trusted.yaml` is the sharp end of this: it carries a digest that still matches, so
# it silently satisfies a `trust.require` policy layer in the project it is scaffolded into.
#
# It has to be a deny-list. An allow-list would drop the tracked `.claude/skills/rayspec/` mirror
# that `scripts/gen_skill.py --check` compares the packaged skill against, so a distributor could
# not run the test suite from an unpacked sdist.
[tool.hatch.build]
exclude = [
  # next to an example project a maintainer has actually run
  "examples/**/.claude",
  "examples/**/.rayspec/runs",
  "examples/**/.rayspec/trusted.yaml",
  "examples/**/.rayspec/rayspec.lock",
  # and the same at the repository root, where `.claude/skills/rayspec/` is tracked on purpose and
  # has to stay, so only the local-settings file goes
  "/.claude/settings.local.json",
  "/.rayspec/runs",
  "/.rayspec/trusted.yaml",
  "/.rayspec/rayspec.lock",
  # secrets, wherever they are: unanchored, so this is every directory, not just the root
  ".env",
  # the bill of materials and the release notes, which the release job writes into the checkout
  "/provenance",
]

# `rayspec init --from <example>` scaffolds one of the example projects, so the corpus has to be
# importable data — a `uv tool install rayspec` user has no checkout to copy from. `examples/` is
# listed as an ordinary source directory and remapped into the package by `sources` below, so the
# usual file selection applies to it: force-include would copy the working tree verbatim, VCS
# ignore rules and `exclude` alike, and publish whatever local state the release checkout holds.
# No `exclude` of its own: declaring one here would replace the shared list above instead of
# adding to it.
[tool.hatch.build.targets.wheel]
only-include = ["src/rayspec", "examples"]

[tool.hatch.build.targets.wheel.sources]
"src/rayspec" = "rayspec"
"examples" = "rayspec/examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra -p anyio"
markers = [
  "live: hits a real provider (needs credentials); deselected by default",
]
filterwarnings = ["error::DeprecationWarning:rayspec.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff >= 0.16 formats fenced code in Markdown; our docs keep hand-wrapped snippets.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF", "PL"]
ignore = ["PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLR0911", "PLC0415", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PL", "B011", "SIM117", "E501"]

# The engine and providers must only cancel/timeout via anyio so that both SDKs' shielded cleanup
# paths are honored (raw asyncio cancellation skips them). See docs/constitution.md.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.timeout".msg = "use anyio.fail_after / anyio.move_on_after"
"asyncio.wait_for".msg = "use anyio.fail_after / anyio.move_on_after"
"asyncio.TaskGroup".msg = "use anyio.create_task_group"
"asyncio.gather".msg = "use anyio.create_task_group"
"asyncio.create_task".msg = "use anyio.create_task_group / tg.start_soon"
"asyncio.shield".msg = "use anyio.CancelScope(shield=True)"
"asyncio.run".msg = "use anyio.run(..., backend='asyncio')"
"asyncio.Semaphore".msg = "use anyio.CapacityLimiter / anyio.Semaphore"
"asyncio.Lock".msg = "use anyio.Lock"
"asyncio.Event".msg = "use anyio.Event"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
