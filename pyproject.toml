[project]
name = "rayspec"
version = "1.0.0"
description = "Declarative agent workflows for coding agents (Claude Agent SDK + OpenAI Codex SDK). CLI only."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "rayspec-labs" }]
keywords = ["agents", "workflows", "claude", "codex", "cli", "yaml"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]

dependencies = [
  "claude-agent-sdk>=0.2.142",
  "openai-codex>=0.147.0",
  "pydantic>=2.12",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "anyio>=4.4",
  "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/rayspec-labs/rayspec-py"
Repository = "https://github.com/rayspec-labs/rayspec-py"
Changelog = "https://github.com/rayspec-labs/rayspec-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/rayspec-labs/rayspec-py/issues"

[project.scripts]
rayspec = "rayspec.cli.app:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "types-PyYAML",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 list-form `license-files` (metadata 2.4+)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rayspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra -p anyio"
markers = [
  "live: hits a real provider (needs credentials); deselected by default",
]
filterwarnings = ["error::DeprecationWarning:rayspec.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff >= 0.16 formats fenced code in Markdown; our docs keep hand-wrapped snippets.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF", "PL"]
ignore = ["PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLR0911", "PLC0415", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PL", "B011", "SIM117", "E501"]

# The engine and providers must only cancel/timeout via anyio so that both SDKs' shielded cleanup
# paths are honored (raw asyncio cancellation skips them). See docs/constitution.md.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.timeout".msg = "use anyio.fail_after / anyio.move_on_after"
"asyncio.wait_for".msg = "use anyio.fail_after / anyio.move_on_after"
"asyncio.TaskGroup".msg = "use anyio.create_task_group"
"asyncio.gather".msg = "use anyio.create_task_group"
"asyncio.create_task".msg = "use anyio.create_task_group / tg.start_soon"
"asyncio.shield".msg = "use anyio.CancelScope(shield=True)"
"asyncio.run".msg = "use anyio.run(..., backend='asyncio')"
"asyncio.Semaphore".msg = "use anyio.CapacityLimiter / anyio.Semaphore"
"asyncio.Lock".msg = "use anyio.Lock"
"asyncio.Event".msg = "use anyio.Event"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
