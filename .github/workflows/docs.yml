# Build the documentation site and publish it on GitHub Pages.
#
# The site is the same `docs/*.md` GitHub renders, so a pull request builds it with `--strict`:
# a link that resolves in one rendering and not in the other fails here. Only `main` deploys.
#
# One-time setup, and the reason a first run can fail on a repository that has never published:
# Settings → Pages → Source must be "GitHub Actions". Pages needs a public repository (or an
# Enterprise plan); while the repository is private the build job still runs and the deploy job
# is the only part that cannot work.
name: docs

on:
  push:
    branches: [main]
    # GitHub's workflow parser has no YAML anchors, so this list is written out twice.
    paths:
      - docs/**
      - mkdocs.yml
      - scripts/mkdocs_hooks.py
      - README.md
      - CHANGELOG.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - scripts/mkdocs_hooks.py
      - README.md
      - CHANGELOG.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run --group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the artefact built above
      id-token: write # the Pages deployment is an OIDC exchange, not a token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
