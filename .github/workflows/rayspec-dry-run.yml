# Reusable workflow: dry-run a rayspec workflow on a pull request and report the result.
#
# It is meant to be called from any repository that keeps a rayspec project — this one is not
# special. A dry run replaces every provider with the scripted stub, so the check costs nothing,
# needs no provider credential and never waits for a person.
#
#   # .github/workflows/rayspec.yml in your repository
#   on: [pull_request]
#   jobs:
#     dry-run:
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: rayspec-labs/rayspec-py/.github/workflows/rayspec-dry-run.yml@v1
#       with:
#         workflow: example                    # what `rayspec init` scaffolds — swap in your own
#         stubs: .rayspec/stubs/example.yaml   # and the stub script it writes next to it
#         rayspec-version: "1.0.0"
#
# The caller's token has to carry `pull-requests: write` for the comment. Without it the run
# still reports — into the job summary — and says why the comment is missing.
#
# This workflow asks for no permission of its own. In a called workflow a `permissions:` block is
# a request the caller has to be able to satisfy, not a narrowing of what it granted: asking for
# `pull-requests: write` refuses the call outright for any caller that cannot grant it — the one
# who forgot the line, and a pull request from a fork, whose token is read-only — instead of
# degrading to the job summary. What runs here is exactly what the calling job granted, no more.
#
# Every outcome is reported, not only the good one: `status` and `exit-code` are set for a run
# that failed, paused, was cancelled or never started, and `fail-on-error: false` hands that
# verdict to the caller instead of failing the check.
name: rayspec dry run

on:
  workflow_call:
    inputs:
      workflow:
        description: The workflow to dry-run (a discovered name or a path).
        required: true
        type: string
      project-dir:
        description: Directory holding the rayspec project (where `.rayspec/` lives).
        default: "."
        type: string
      stubs:
        description: Stub script supplying the agents' answers, relative to `project-dir`.
        default: ""
        type: string
      inputs-file:
        description: YAML/JSON file of workflow inputs, relative to `project-dir`.
        default: ""
        type: string
      rayspec-version:
        # No default may mean "whatever is newest": the `rayspec` name on PyPI was parked with a
        # 0.0.1 placeholder before the first release, so *latest* can still resolve to a stub.
        # The floor is the 1.x line that the `@v1` ref follows; a bare version pins exactly.
        description: >-
          Version to install from PyPI: a bare version pins it exactly (1.0.0), anything starting
          with an operator is a specifier (>=1.2,<2). Pin it — a check that changes with someone
          else's release is a check nobody trusts.
        default: ">=1.0.0,<2"
        type: string
      python-version:
        description: Interpreter rayspec runs on.
        default: "3.12"
        type: string
      comment:
        description: Post the result as a pull-request comment (edited in place on every push).
        default: true
        type: boolean
      comment-tag:
        description: Distinguishes the comments of several calls in one pull request.
        default: "default"
        type: string
      fail-on-error:
        description: Fail the check when the dry run did not succeed.
        default: true
        type: boolean
    outputs:
      status:
        description: succeeded · failed · paused · cancelled · not started (usage error)
        value: ${{ jobs.dry-run.outputs.status }}
      exit-code:
        description: The exit code rayspec returned.
        value: ${{ jobs.dry-run.outputs.exit-code }}

jobs:
  dry-run:
    name: rayspec dry run
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.run.outputs.status }}
      exit-code: ${{ steps.run.outputs.exit-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pinning the action pins none of what it installs: without this, the tool that
          # resolves and installs rayspec is whatever uv was released this morning.
          version: "0.12.5"
          python-version: ${{ inputs.python-version }}
          enable-cache: false

      - name: Install rayspec
        env:
          VERSION: ${{ inputs.rayspec-version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            "")
              echo "::error::rayspec-version is empty — that installs whatever PyPI serves as the latest release. Pass a version, or leave the input out for the default."
              exit 1
              ;;
            # `v1.0.0` is the tag this workflow is called at, so a caller reaches for it here
            # too; `uv tool install rayspecv1.0.0` would be a baffling way to say no.
            v[0-9]*) spec="rayspec==${VERSION#v}" ;;
            [0-9]*) spec="rayspec==$VERSION" ;;
            *) spec="rayspec$VERSION" ;;
          esac
          echo "installing $spec"
          uv tool install "$spec"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Dry-run the workflow
        id: run
        working-directory: ${{ inputs.project-dir }}
        env:
          WORKFLOW: ${{ inputs.workflow }}
          STUBS: ${{ inputs.stubs }}
          INPUTS_FILE: ${{ inputs.inputs-file }}
        run: |
          set -uo pipefail
          args=("$WORKFLOW" --dry-run --no-interactive --json)
          if [ -n "$STUBS" ]; then args+=(--stubs "$STUBS"); fi
          if [ -n "$INPUTS_FILE" ]; then args+=(--inputs-file "$INPUTS_FILE"); fi
          rayspec version || true
          # `|| code=$?` is what keeps the rest of this step alive. A `run:` block is executed as
          # `bash -e {0}`, and `set -uo pipefail` above does not turn that `-e` off: a bare
          # `rayspec run` that exits non-zero would end the step here, before a status was ever
          # written — which is every outcome this check exists to report. errexit does not apply
          # to a command on the left of `||`, so the exit code is caught instead of fatal.
          code=0
          rayspec run "${args[@]}" \
            > "$RUNNER_TEMP/rayspec-events.jsonl" \
            2> "$RUNNER_TEMP/rayspec-errors.txt" || code=$?
          case "$code" in
            0) status=succeeded ;;
            1) status=failed ;;
            2) status="not started (usage error)" ;;
            3) status=paused ;;
            4) status=cancelled ;;
            *) status="exit $code" ;;
          esac
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "rayspec exited $code — $status"
          tail -c 4000 "$RUNNER_TEMP/rayspec-errors.txt" || true
          if [ "$code" -ne 0 ]; then
            # stdout is a file, so without this the log of a failed run is empty.
            echo "--- the end of the event stream"
            tail -c 4000 "$RUNNER_TEMP/rayspec-events.jsonl" || true
          fi
          # This step reports; it never decides. Whether a run that did not succeed fails the
          # check is `fail-on-error`, read once by the last step in this job.
          exit 0

      - name: Render the result
        id: render
        if: always()
        env:
          RAYSPEC_EVENTS: ${{ runner.temp }}/rayspec-events.jsonl
          RAYSPEC_ERRORS: ${{ runner.temp }}/rayspec-errors.txt
          RAYSPEC_OUTPUT: ${{ runner.temp }}/rayspec-comment.md
          RAYSPEC_EXIT: ${{ steps.run.outputs.exit-code }}
          RAYSPEC_WORKFLOW: ${{ inputs.workflow }}
          RAYSPEC_MARKER: "<!-- rayspec-dry-run: ${{ inputs.comment-tag }} -->"
          RAYSPEC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          MAX = 60000  # a comment holds 65536 characters; leave room for the marker and footer
          BY_CODE = {
              0: "succeeded",
              1: "failed",
              2: "not started (usage error)",
              3: "paused",
              4: "cancelled",
          }
          ICON = {
              "succeeded": "white_check_mark",
              "failed": "x",
              "paused": "hourglass",
              "cancelled": "no_entry_sign",
          }


          def read(name: str) -> str:
              path = os.environ.get(name, "")
              try:
                  return pathlib.Path(path).read_text(encoding="utf-8", errors="replace")
              except OSError:
                  return ""


          # Empty when the run step never reported one — the report still has to say something.
          raw_exit = (os.environ.get("RAYSPEC_EXIT") or "").strip()
          exit_code = int(raw_exit) if raw_exit.lstrip("-").isdigit() else None
          workflow = os.environ.get("RAYSPEC_WORKFLOW", "?")

          records = []
          for line in read("RAYSPEC_EVENTS").splitlines():
              if line.strip():
                  try:
                      record = json.loads(line)
                  except ValueError:
                      continue  # a stream cut off mid-line is still worth reporting on
                  if isinstance(record, dict):
                      records.append(record)

          # A workflow can fail to run in two shapes and they report differently, so the body is
          # built from BOTH sources. A document that parses but does not validate (an unknown step
          # in a `needs:`, a capability the provider lacks) puts an `errors` object on stdout —
          # that is what this loop reads. A document that does not parse at all (bad YAML, a step
          # with no kind) writes nothing to stdout and one `error:` line to stderr, which the run
          # step captured and RAYSPEC_ERRORS renders below.
          problems: list[str] = []
          kind = "errors"
          for record in records:
              if "errors" in record and "type" not in record:
                  kind = str(record.get("error") or "errors")
                  problems += [str(item) for item in record["errors"] or []]

          summary = records[-1] if records and "exit_code" in records[-1] else {}
          if exit_code is None:
              status = "did not run"
          else:
              status = summary.get("status") or BY_CODE.get(exit_code, f"exit {exit_code}")

          body = [os.environ.get("RAYSPEC_MARKER", ""), ""]
          icon = ICON.get(status, "grey_question" if exit_code == 0 else "x")
          body += [f"### :{icon}: rayspec dry run — `{workflow}` {status}", ""]

          steps = [r for r in records if r.get("type") == "step.finished"]
          if steps:
              body += ["| Step | Result | Time |", "| --- | --- | --- |"]
              for record in steps:
                  data = record.get("data") or {}
                  result = str(data.get("status", "?"))
                  if data.get("tolerated"):
                      result += " (tolerated)"
                  if data.get("skip_reason"):
                      result += f" ({data['skip_reason']})"
                  path = record.get("step_path", "?")
                  body.append(f"| `{path}` | {result} | {data.get('duration_ms', '?')} ms |")
              body.append("")

          outputs = summary.get("outputs") or {}
          if outputs:
              rendered = json.dumps(outputs, indent=2, ensure_ascii=False, sort_keys=True)
              body += ["<details><summary>Outputs</summary>", "", "```json", rendered, "```"]
              body += ["", "</details>", ""]

          if problems:
              body += [f"**{kind}**", "", "```"] + problems + ["```", ""]

          errors = read("RAYSPEC_ERRORS").strip()
          if errors and status != "succeeded":
              body += ["```", errors[-4000:], "```", ""]

          footer = [f"exit code `{exit_code if exit_code is not None else '?'}`"]
          if summary.get("run_id"):
              footer.append(f"run `{summary['run_id']}`")
          if summary.get("reason"):
              footer.append(str(summary["reason"]))
          footer.append(
              "no agent was called: `--dry-run` answers every prompt from the scripted stub"
          )
          if os.environ.get("RAYSPEC_RUN_URL"):
              footer.append(f"[workflow run]({os.environ['RAYSPEC_RUN_URL']})")
          body.append("<sub>" + " · ".join(footer) + "</sub>")

          text = "\n".join(body).rstrip() + "\n"
          if len(text) > MAX:
              text = text[:MAX] + "\n\n<sub>…truncated.</sub>\n"
          pathlib.Path(os.environ["RAYSPEC_OUTPUT"]).write_text(text, encoding="utf-8")
          PY
          cat "$RAYSPEC_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        id: comment
        # A pull request from a fork gets a read-only token: the report is in the job summary
        # either way, and a missing comment must not read as a failed check.
        if: >-
          always()
          && inputs.comment
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BODY: ${{ runner.temp }}/rayspec-comment.md
          COMMENT_TAG: ${{ inputs.comment-tag }}
          MARKER: "<!-- rayspec-dry-run: ${{ inputs.comment-tag }} -->"
        run: |
          set -uo pipefail
          # The marker is part of the jq program below, so the tag has to be a plain name: a
          # quote or a backslash in it would rewrite the filter instead of being searched for.
          case "$COMMENT_TAG" in
            "" | *[!A-Za-z0-9._-]*)
              echo "::error::comment-tag must match [A-Za-z0-9._-]+ — got: $COMMENT_TAG"
              exit 1
              ;;
          esac
          post() {
            # --paginate runs --jq once per page, so more than one page can answer.
            existing=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
              --jq "[.[] | select(.body | contains(\"$MARKER\"))] | last | .id // empty" \
              | tail -n1) || return 1
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$BODY" --silent
            else
              gh api -X POST "repos/$REPO/issues/$NUMBER/comments" -F "body=@$BODY" --silent
            fi
          }
          # `gh` fails for more than one reason and the report must not misdiagnose the one it
          # got: a missing grant is 403, a pull request this token cannot see is 404, and a
          # network blip is neither. Its own stderr is quoted when it is none of those.
          rc=0
          said=$(post 2>&1) || rc=$?
          if [ "$rc" -ne 0 ]; then
            said=$(printf '%s' "$said" | tr '\n\r' '  ' | tail -c 300)
            case "$said" in
              *"HTTP 403"*) why="the calling job needs permissions: pull-requests: write" ;;
              *"HTTP 404"*) why="$REPO#$NUMBER is not visible to this job's token" ;;
              *[![:space:]]*) why="gh exited $rc: $said" ;;
              *) why="gh exited $rc without a message — a network problem, most likely" ;;
            esac
            # One line: GitHub reads only the first line of an annotation, and the second half is
            # the half that says what to do about it.
            echo "::warning::could not post the comment — $why. The result is in this run's job summary."
          fi

      - name: Fail the check when the dry run did not succeed
        if: inputs.fail-on-error && steps.run.outputs.status != 'succeeded'
        env:
          STATUS: ${{ steps.run.outputs.status }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          echo "::error::rayspec dry run of '$WORKFLOW' ended: $STATUS"
          exit 1
