# Cut a release: build, check, publish to PyPI, sign, and attach everything to a GitHub release.
#
# Push the tag and this is the whole release; no long-lived credential is stored anywhere. PyPI is
# reached through Trusted Publishing (a short-lived OIDC token minted for this repository), the
# artefacts are signed with Sigstore, and the notes are the CHANGELOG section of the version —
# so a tag whose version nobody described stops the run before anything is published.
#
# `workflow_dispatch` is the rehearsal: it builds, checks, generates the bill of materials and
# the notes, and stops short of the two irreversible steps.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check the tag against the packaged version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          meta = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = meta["project"]["version"]
          ref = os.environ.get("REF_NAME", "")
          if os.environ.get("EVENT_NAME") == "push":
              tagged = ref.removeprefix("v")
              if tagged != version:
                  print(f"::error::tag {ref} publishes {tagged}, pyproject.toml says {version}")
                  sys.exit(1)
          else:
              print(f"::notice::rehearsal for {version} — nothing will be published")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")
          PY

      - name: Build the sdist and the wheel
        run: uv build --sdist --wheel --out-dir dist

      - name: Check there is exactly one of each, carrying that version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          wheels=(dist/*.whl)
          printf '%s\n' "${sdists[@]}" "${wheels[@]}"
          test "${#sdists[@]}" -eq 1
          test "${#wheels[@]}" -eq 1
          test -f "dist/rayspec-${VERSION}.tar.gz"
          test -f "dist/rayspec-${VERSION}-py3-none-any.whl"

      - name: Check the metadata renders on PyPI
        # 7.0 is the first twine that accepts metadata 2.5, which hatchling writes.
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Install the wheel somewhere clean and run it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          uv run --isolated --no-project \
            --with "dist/rayspec-${VERSION}-py3-none-any.whl" rayspec version

      - name: Take the release notes out of the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p provenance
          python3 scripts/release_notes.py "$VERSION" --output provenance/release-notes.md
          cat provenance/release-notes.md

      - name: Write the bill of materials
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev --no-editable
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment .venv \
            --of JSON --sv 1.6 --pyproject pyproject.toml --output-reproducible \
            -o "provenance/rayspec-${VERSION}.cdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: provenance/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The environment is where the PyPI publisher is bound and where a protection rule can ask a
    # person before the one step nobody can take back.
    environment:
      name: pypi
      url: https://pypi.org/p/rayspec
    permissions:
      # Trusted Publishing: PyPI trades this short-lived OIDC token for an upload token. There is
      # no PyPI credential in this repository, so there is none to leak or to rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true

  announce:
    name: Sign and publish the GitHub release
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the artefacts
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: provenance

      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          upload-signing-artifacts: false

      - name: Create the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file provenance/release-notes.md \
            --verify-tag \
            dist/* provenance/*.cdx.json

      - name: Say what is left for a person to do
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## rayspec ${VERSION} is out"
            echo
            echo "Still by hand, deliberately — none of these is a workflow's decision to take:"
            echo
            echo "1. **Yank the placeholder** on PyPI. The \`rayspec\` name was parked with a"
            echo "   placeholder release; it stays on the index until someone yanks it, and until"
            echo "   then \`pip install rayspec\` can still resolve to it."
            echo "2. **Move the \`v1\` tag** onto this commit, so a repository calling the"
            echo "   reusable dry-run workflow at \`@v1\` gets this release."
            echo "3. Roll the next \`## [Unreleased]\` heading into CHANGELOG.md."
            echo
            echo "Verify what was published:"
            echo
            echo '```'
            echo "uvx rayspec@${VERSION} version"
            echo "gh release download v${VERSION} --pattern '*.sigstore.json'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
