# yaml-language-server: $schema=https://raw.githubusercontent.com/rayspec-labs/rayspec-py/main/schemas/workflow.schema.json
rayspec: 1
name: resolve_conflicts
description: >
  Merge a base branch, classify every conflicted file with a read-only agent, resolve the
  conflicts in a self-healing loop until no marker is left and the tests pass, and ask a human
  before anything the analyst flagged as risky is touched. Ends at a local merge commit in the
  run's worktree; pushing and opening a PR are the caller's job.
# The gate below names approval class `risky`. Hold it shut in your policy, so that no --yes,
# --dry-run or --approve-class can wave a flagged conflict through (a human still can):
#   # .rayspec/policy.yaml
#   approvals: { classes: { risky: { allow_yes: false } } }

inputs:
  base: { type: string, default: main, description: "Branch or ref to merge into the checkout" }
  test_command: { type: string, default: "pytest -q", description: "Must pass once the conflicts are resolved" }
  max_attempts: { type: integer, default: 3, description: "Resolve → verify rounds before the run gives up (1-10)" }

defaults:
  agent: resolver                   # prompt steps without `agent:` use this one
  timeout: 20m
  max_parallel: 3

isolation: worktree                 # the merge and the agent's edits stay out of your checkout

agents:
  analyst:
    provider: claude
    model: small
    access: read-only               # classifies; never edits
    instructions: |
      You classify merge conflicts. You never edit files. For every conflict decide
      - `strategy`: `ours` (keep our side), `theirs` (take the incoming side), `combine` (both
        changes belong and can be merged), `manual` (a human must decide);
      - `risk`: `low` when the resolution is mechanical (the sides touch different things, one
        side is a pure reformat or rename, a lockfile or generated file where one side simply
        wins), `high` when both sides changed the same behaviour for different reasons, when a
        test, migration or security-relevant code is involved, or when you are not sure.
        `manual` is always `high`.
      Be decisive; give the reason in one or two sentences.
  resolver:
    provider: claude
    model: medium
    access: workspace-write
    instructions: |
      You resolve merge conflicts inside {{ run.workdir }}. Preserve the intent of both sides
      wherever they do not collide; never drop one side wholesale unless that is the strategy
      you were given. Leave no conflict marker (<<<<<<<, =======, >>>>>>>) behind. Stage each
      file with `git add` once it is clean. Do NOT commit: the workflow verifies and commits.
    tools: { deny: [web] }

steps:
  - id: merge
    description: Start the merge without committing; a non-zero exit is the normal path (conflicts).
    shell: git merge --no-commit --no-ff "$RAYSPEC_INPUT_BASE"
    allow_failure: true

  - id: conflicts
    needs: [merge]
    description: >
      The conflicted paths as a JSON list (`each:` needs a list) — and the step that tells a merge
      that never started (unknown ref, dirty tree) apart from one that stopped on conflicts.
    python: |
      import json, subprocess, sys

      def git(*args):
          return subprocess.run(["git", *args], capture_output=True, text=True, check=False)

      merged = {{ steps.merge.ok }}
      if not merged and git("rev-parse", "-q", "--verify", "MERGE_HEAD").returncode != 0:
          sys.stderr.write("git merge did not start — see the merge step's output\n")
          sys.exit(1)
      unmerged = git("diff", "--name-only", "--diff-filter=U", "-z").stdout
      print(json.dumps([path for path in unmerged.split("\0") if path]))
    output_schema: { type: array, items: { type: string } }

  - id: clean
    needs: [conflicts]
    when: (steps.conflicts.output | length) == 0
    stop:
      status: cancelled
      reason: >
        git merge {{ inputs.base }} produced no conflicts — nothing to resolve (the merge is left
        staged and uncommitted in {{ run.workdir }})

  - id: analyze
    needs: [conflicts]
    when: (steps.conflicts.output | length) > 0
    description: Read-only classification of every conflict, in parallel, before anything is modified.
    each: steps.conflicts.output
    as: file
    max_parallel: 3
    steps:
      - id: sides
        shell: |
          echo "=== BASE (common ancestor) ==="
          git show ":1:{{ file }}" 2>/dev/null || echo "(no common ancestor: added on both sides)"
          echo "=== OURS (HEAD) ==="
          git show ":2:{{ file }}" 2>/dev/null || echo "(deleted on our side)"
          echo "=== THEIRS ({{ inputs.base }}) ==="
          git show ":3:{{ file }}" 2>/dev/null || echo "(deleted on their side)"
      - id: classify
        needs: [sides]
        agent: analyst
        prompt: |
          Conflict {{ each.index + 1 }} of {{ each.total }}: `{{ file }}` (merging {{ inputs.base }}).
          The three index stages:

          {{ steps.sides.output }}

          Decide how this conflict should be resolved.
        output_schema:                # structured verdict; the gate and the resolver read it
          type: object
          properties:
            strategy: { type: string, enum: [ours, theirs, combine, manual] }
            risk: { type: string, enum: [low, high] }
            reason: { type: string }
          required: [strategy, risk, reason]

  - id: gate
    needs: [analyze]
    description: A human sees every risky file before any file is modified.
    when: (steps.analyze.output | map(attribute='classify.risk') | select('equalto', 'high') | list | length) > 0
    approve:
      message: |
        {{ steps.analyze.output | map(attribute='classify.risk') | select('equalto', 'high') | list | length }} of {{ steps.conflicts.output | length }} conflict(s) need judgement:
        {% for file in steps.conflicts.output %}
        {% set verdict = steps.analyze.output[loop.index0].classify %}
        {% if verdict.risk == 'high' %}
        - {{ file }} → {{ verdict.strategy }}: {{ verdict.reason }}
        {% endif %}
        {% endfor %}
        Let the resolver touch them?
      class: risky                  # the operator's rules for this kind of gate, named not defined

  - id: resolve
    needs: [gate, analyze]
    join: any                       # the gate is skipped when nothing is risky; when it ran it must have passed
    loop:
      max_iterations: 10            # hard ceiling; the bound you set is inputs.max_attempts (`give_up` below)
      until: steps.check.ok
      on_exhausted: fail
      steps:
        - id: fix
          session: fix              # continue my own session from the previous attempt
          prompt: |
            {% if iteration.first %}
            Resolve every conflict left by `git merge {{ inputs.base }}` in {{ run.workdir }}
            (`git diff --name-only --diff-filter=U` lists them). The analyst's verdict per file:
            {% for file in steps.conflicts.output %}
            {% set verdict = steps.analyze.output[loop.index0].classify %}
            - `{{ file }}` → {{ verdict.strategy }} ({{ verdict.risk }} risk): {{ verdict.reason }}
            {% endfor %}

            Stage each file with `git add` once it is clean; do not commit.
            `{{ inputs.test_command }}` must pass afterwards.
            {% else %}
            Attempt {{ iteration.n }} of {{ inputs.max_attempts }}. Verification failed after your
            last resolution (exit {{ iteration.prev.check.exit_code }}):

            {{ iteration.prev.check.output | default('') }}

            Fix the resolution, re-stage the files, do not commit.
            {% endif %}
        - id: check
          needs: [fix]
          description: Markers first — authoritative, before any test runs — then the test command.
          shell: |
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -n "$unresolved" ]; then
              echo "conflict markers still unresolved in:"; echo "$unresolved"; exit 1
            fi
            # `git add` on a file that still carries markers makes the index look merged — look again
            touched="$(git diff --name-only -z HEAD | tr '\0' '\n')"
            if [ -n "$touched" ] && printf '%s\n' "$touched" | xargs git grep -l -E '^(<{7}|>{7})( |$)' -- ; then
              echo "conflict markers left in a staged file (listed above)"; exit 1
            fi
            eval "$RAYSPEC_INPUT_TEST_COMMAND" 2>&1   # one transcript: the next prompt and give_up show it
          allow_failure: true       # non-zero exit → failed + tolerated; the loop reads ok / exit_code / output
        - id: give_up
          needs: [check]
          when: (not steps.check.ok) and iteration.n >= inputs.max_attempts
          stop:
            status: failed
            reason: |
              not resolved after {{ iteration.n }} attempt(s); verification said (exit {{ steps.check.exit_code }}):
              {{ steps.check.output }}

  - id: commit
    needs: [resolve]
    shell: |
      git commit --no-edit --quiet
      git log -1 --oneline

outputs:
  files: "{{ steps.conflicts.output }}"
  risky: "{{ steps.analyze.output | map(attribute='classify.risk') | select('equalto', 'high') | list | length }}"
  attempts: "{{ steps.resolve.iterations }}"
  commit: "{{ steps.commit.output }}"
