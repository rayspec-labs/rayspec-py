# Offline coverage of the workflow library bundled with rayspec (src/rayspec/workflows/defaults/).
# tests/workflows/test_defaults.py copies this file and stubs/ into a project root that has NO
# .rayspec/ and runs `rayspec test` there, so every case resolves its workflow from the bundled
# copy — the way a fresh `pip install rayspec` user meets it.
checks:
  - id: block
    workflow: review_block
    inputs: { target: src/, depth: deep }
    stubs: stubs/pr_review.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: request_changes }
      steps: { claude_review: succeeded, codex_review: succeeded, judge: succeeded }
  - id: pr
    workflow: pr_review
    inputs: { pr: 17, post: true }
    stubs: stubs/pr_review.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: request_changes, commented: true }
      steps: { "review/judge": succeeded, review: succeeded, comment: succeeded }
  - id: pr_no_post
    workflow: pr_review
    inputs: { pr: 17 }
    stubs: stubs/pr_review.yaml
    expect:
      status: succeeded
      outputs: { commented: false }
      steps: { comment: skipped }
  - id: pr_default_stubs           # the acceptance run: no stubs file at all, schema-shaped answers
    workflow: pr_review
    inputs: { pr: 1 }
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: approve, commented: false }
      steps: { "review/codex_review": succeeded, "review/judge": succeeded, comment: skipped }
  - id: fix_happy
    workflow: fix_issue
    inputs: { issue: 42 }
    stubs: stubs/fix_issue.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: fix, iterations: 2 }
      steps:
        bail: skipped
        "build[1]/review": succeeded
        "build[2]/review": succeeded
        build: succeeded
        confirm: succeeded
        pr: succeeded
  - id: fix_skip
    workflow: fix_issue
    inputs: { issue: 7, mode: fast }
    stubs: stubs/fix_issue_skip.yaml
    expect:
      status: cancelled
      exit_code: 4
      reason_contains: "duplicate of #41"
      steps: { bail: succeeded, build: skipped }
  - id: fix_exhausted
    workflow: fix_issue
    inputs: { issue: 9 }
    stubs: stubs/fix_issue_exhausted.yaml
    expect:
      status: failed
      exit_code: 1
      steps: { build: failed, confirm: skipped }
  - id: release_dry
    workflow: release_check
    inputs: { tag: v0.4.0 }
    stubs: stubs/release_check.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs: { title: "v0.4.0 — worktrees by default", approved: true, published: false }
      steps: { tests: succeeded, history: succeeded, gate: succeeded, publish: skipped, notify: skipped, cleanup: succeeded }
  - id: release_push
    workflow: release_check
    inputs: { tag: v0.4.0, push: true, min_coverage: 90 }
    stubs: stubs/release_check.yaml
    env: { SLACK_WEBHOOK: null }    # `notify` is gated on `env.SLACK_WEBHOOK is defined` → unset it
    expect:
      status: succeeded
      outputs: { published: true }
      steps: { publish: succeeded, notify: skipped, cleanup: succeeded }
  - id: release_push_notify
    workflow: release_check
    inputs: { tag: v0.4.0, push: true }
    stubs: stubs/release_check.yaml
    env: { SLACK_WEBHOOK: "https://hooks.example.invalid/T000/B000" }
    expect:
      status: succeeded
      outputs: { published: true }
      steps: { publish: succeeded, notify: succeeded, cleanup: succeeded }
  - id: conflicts_clean            # a dry run simulates `conflicts` as [] → the clean-merge path
    workflow: resolve_conflicts
    inputs: { base: main }
    expect:
      status: cancelled
      exit_code: 4
      reason_contains: "nothing to resolve"
      steps:
        conflicts: { status: succeeded, output_json: [] }
        clean: succeeded
        analyze: { status: skipped, skip_reason: when_false }
        gate: skipped
        resolve: skipped
        commit: skipped
  - id: panel_approve              # the acceptance run: no stubs, schema-shaped answers, five lenses
    workflow: review_panel
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: approve, blockers: 0, disagreements: 0, reviewed: 5, lost: 0, commented: false }
      steps:
        checkout: { status: skipped, skip_reason: when_false }
        diff: succeeded
        nothing: { status: skipped, skip_reason: when_false }
        panel: succeeded
        "panel[0]/review": succeeded
        "panel[4]/review": succeeded
        no_reviews: { status: skipped, skip_reason: when_false }
        synthesize: succeeded
        comment: { status: skipped, skip_reason: when_false }
  - id: panel_blocker
    workflow: review_panel
    stubs: stubs/review_panel.yaml
    expect:
      status: succeeded
      outputs:
        verdict: request_changes
        blockers: 1
        findings:
          - { severity: blocker, file: app.py, note: "user input reaches eval()", raised_by: [security] }
      steps: { panel: succeeded, synthesize: succeeded }
  - id: panel_contradiction
    workflow: review_panel
    stubs: stubs/review_panel_contradiction.yaml
    expect:
      status: succeeded
      outputs: { verdict: request_changes, blockers: 1, disagreements: 1 }
  - id: panel_lost                 # one reviewer lost: the chair still runs, the counts say so
    workflow: review_panel
    stubs: stubs/review_panel_lost.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: approve, reviewed: 4, lost: 1 }
      steps:
        "panel[1]/review": succeeded
        "panel[2]/review": failed
        panel: succeeded
        no_reviews: { status: skipped, skip_reason: when_false }
        synthesize: succeeded
  - id: panel_all_lost             # every reviewer lost: nothing to synthesise → failed, chair never asked
    workflow: review_panel
    stubs: stubs/review_panel_all_lost.yaml
    expect:
      status: failed
      exit_code: 1
      reason_contains: "every reviewer failed"
      steps:
        "panel[0]/review": failed
        "panel[4]/review": failed
        panel: succeeded
        no_reviews: succeeded
        synthesize: { status: skipped, skip_reason: when_false }
        comment: skipped
  - id: panel_raised_by            # three lenses, one finding: listed once, attributed to all three
    workflow: review_panel
    stubs: stubs/review_panel_raised_by.yaml
    expect:
      status: succeeded
      outputs:
        blockers: 0
        findings:
          - severity: major
            file: app.py
            note: "off-by-one in the slice: the last element is dropped, and leaks under a crafted length"
            raised_by: [security, correctness, tests]
  - id: panel_pair                 # two lenses: each reviewer is told exactly the other one
    workflow: review_panel
    inputs: { lenses: [security, correctness] }
    stubs: stubs/review_panel_pair.yaml
    expect:
      status: succeeded
      outputs: { reviewed: 2, lost: 0 }
      steps: { "panel[0]/review": succeeded, "panel[1]/review": succeeded }
  - id: panel_solo                 # one lens: the reviewer is told it is alone
    workflow: review_panel
    inputs: { lenses: [tests] }
    stubs: stubs/review_panel_pair.yaml
    expect:
      status: succeeded
      outputs: { reviewed: 1 }
      steps: { "panel[0]/review": succeeded }
  - id: panel_pr_post              # with a PR and post: checkout and the comment run (simulated in a dry run)
    workflow: review_panel
    inputs: { pr: 12, post: true }
    expect:
      status: succeeded
      outputs: { commented: true }
      steps: { checkout: succeeded, diff: succeeded, comment: succeeded }
  - id: panel_pr_no_post
    workflow: review_panel
    inputs: { pr: 12 }
    expect:
      status: succeeded
      outputs: { commented: false }
      steps: { checkout: succeeded, comment: { status: skipped, skip_reason: when_false } }
