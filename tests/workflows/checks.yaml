# Offline coverage of the workflow library bundled with rayspec (src/rayspec/workflows/defaults/).
# tests/workflows/test_defaults.py copies this file and stubs/ into a project root that has NO
# .rayspec/ and runs `rayspec test` there, so every case resolves its workflow from the bundled
# copy — the way a fresh `pip install rayspec` user meets it.
checks:
  - id: block
    workflow: review_block
    inputs: { target: src/, depth: deep }
    stubs: stubs/pr_review.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: request_changes }
      steps: { claude_review: succeeded, codex_review: succeeded, judge: succeeded }
  - id: pr
    workflow: pr_review
    inputs: { pr: 17, post: true }
    stubs: stubs/pr_review.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: request_changes, commented: true }
      steps: { "review/judge": succeeded, review: succeeded, comment: succeeded }
  - id: pr_no_post
    workflow: pr_review
    inputs: { pr: 17 }
    stubs: stubs/pr_review.yaml
    expect:
      status: succeeded
      outputs: { commented: false }
      steps: { comment: skipped }
  - id: pr_default_stubs           # the acceptance run: no stubs file at all, schema-shaped answers
    workflow: pr_review
    inputs: { pr: 1 }
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: approve, commented: false }
      steps: { "review/codex_review": succeeded, "review/judge": succeeded, comment: skipped }
  - id: fix_happy
    workflow: fix_issue
    inputs: { issue: 42 }
    stubs: stubs/fix_issue.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: fix, iterations: 2 }
      steps:
        bail: skipped
        "build[1]/review": succeeded
        "build[2]/review": succeeded
        build: succeeded
        confirm: succeeded
        pr: succeeded
  - id: fix_skip
    workflow: fix_issue
    inputs: { issue: 7, mode: fast }
    stubs: stubs/fix_issue_skip.yaml
    expect:
      status: cancelled
      exit_code: 4
      reason_contains: "duplicate of #41"
      steps: { bail: succeeded, build: skipped }
  - id: fix_exhausted
    workflow: fix_issue
    inputs: { issue: 9 }
    stubs: stubs/fix_issue_exhausted.yaml
    expect:
      status: failed
      exit_code: 1
      steps: { build: failed, confirm: skipped }
  - id: release_dry
    workflow: release_check
    inputs: { tag: v0.4.0 }
    stubs: stubs/release_check.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs: { title: "v0.4.0 — worktrees by default", approved: true, published: false }
      steps: { tests: succeeded, history: succeeded, gate: succeeded, publish: skipped, notify: skipped, cleanup: succeeded }
  - id: release_push
    workflow: release_check
    inputs: { tag: v0.4.0, push: true, min_coverage: 90 }
    stubs: stubs/release_check.yaml
    env: { SLACK_WEBHOOK: null }    # `notify` is gated on `env.SLACK_WEBHOOK is defined` → unset it
    expect:
      status: succeeded
      outputs: { published: true }
      steps: { publish: succeeded, notify: skipped, cleanup: succeeded }
  - id: release_push_notify
    workflow: release_check
    inputs: { tag: v0.4.0, push: true }
    stubs: stubs/release_check.yaml
    env: { SLACK_WEBHOOK: "https://hooks.example.invalid/T000/B000" }
    expect:
      status: succeeded
      outputs: { published: true }
      steps: { publish: succeeded, notify: succeeded, cleanup: succeeded }
  - id: conflicts_clean            # a dry run simulates `conflicts` as [] → the clean-merge path
    workflow: resolve_conflicts
    inputs: { base: main }
    expect:
      status: cancelled
      exit_code: 4
      reason_contains: "nothing to resolve"
      steps:
        conflicts: { status: succeeded, output_json: [] }
        clean: succeeded
        analyze: { status: skipped, skip_reason: when_false }
        gate: skipped
        resolve: skipped
        commit: skipped
  - id: panel_approve              # the acceptance run: no stubs, schema-shaped answers, five lenses
    workflow: review_panel
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: approve, blockers: 0, disagreements: 0, reviewed: 5, lost: 0, commented: false }
      steps:
        checkout: { status: skipped, skip_reason: when_false }
        diff: succeeded
        nothing: { status: skipped, skip_reason: when_false }
        panel: succeeded
        "panel[0]/review": succeeded
        "panel[4]/review": succeeded
        no_reviews: { status: skipped, skip_reason: when_false }
        synthesize: succeeded
        comment: { status: skipped, skip_reason: when_false }
  - id: panel_blocker
    workflow: review_panel
    stubs: stubs/review_panel.yaml
    expect:
      status: succeeded
      outputs:
        verdict: request_changes
        blockers: 1
        findings:
          - { severity: blocker, file: app.py, note: "user input reaches eval()", raised_by: [security] }
      steps: { panel: succeeded, synthesize: succeeded }
  - id: panel_contradiction
    workflow: review_panel
    stubs: stubs/review_panel_contradiction.yaml
    expect:
      status: succeeded
      outputs: { verdict: request_changes, blockers: 1, disagreements: 1 }
  - id: panel_lost                 # one reviewer lost: the chair still runs, the counts say so
    workflow: review_panel
    stubs: stubs/review_panel_lost.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs: { verdict: approve, reviewed: 4, lost: 1 }
      steps:
        "panel[1]/review": succeeded
        "panel[2]/review": failed
        panel: succeeded
        no_reviews: { status: skipped, skip_reason: when_false }
        synthesize: succeeded
  - id: panel_all_lost             # every reviewer lost: nothing to synthesise → failed, chair never asked
    workflow: review_panel
    stubs: stubs/review_panel_all_lost.yaml
    expect:
      status: failed
      exit_code: 1
      reason_contains: "every reviewer failed"
      steps:
        "panel[0]/review": failed
        "panel[4]/review": failed
        panel: succeeded
        no_reviews: succeeded
        synthesize: { status: skipped, skip_reason: when_false }
        comment: skipped
  - id: panel_raised_by            # three lenses, one finding: listed once, attributed to all three
    workflow: review_panel
    stubs: stubs/review_panel_raised_by.yaml
    expect:
      status: succeeded
      outputs:
        blockers: 0
        findings:
          - severity: major
            file: app.py
            note: "off-by-one in the slice: the last element is dropped, and leaks under a crafted length"
            raised_by: [security, correctness, tests]
  - id: panel_pair                 # two lenses: each reviewer is told exactly the other one
    workflow: review_panel
    inputs: { lenses: [security, correctness] }
    stubs: stubs/review_panel_pair.yaml
    expect:
      status: succeeded
      outputs: { reviewed: 2, lost: 0 }
      steps: { "panel[0]/review": succeeded, "panel[1]/review": succeeded }
  - id: panel_solo                 # one lens: the reviewer is told it is alone
    workflow: review_panel
    inputs: { lenses: [tests] }
    stubs: stubs/review_panel_pair.yaml
    expect:
      status: succeeded
      outputs: { reviewed: 1 }
      steps: { "panel[0]/review": succeeded }
  - id: panel_pr_post              # with a PR and post: checkout and the comment run (simulated in a dry run)
    workflow: review_panel
    inputs: { pr: 12, post: true }
    expect:
      status: succeeded
      outputs: { commented: true }
      steps: { checkout: succeeded, diff: succeeded, comment: succeeded }
  - id: panel_pr_no_post
    workflow: review_panel
    inputs: { pr: 12 }
    expect:
      status: succeeded
      outputs: { commented: false }
      steps: { checkout: succeeded, comment: { status: skipped, skip_reason: when_false } }
  - id: issue_defaults             # no stubs: schema-shaped answers, no candidates, the dry run approves the gate
    workflow: create_issue
    inputs: { description: "Crash on empty input" }
    expect:
      status: succeeded
      exit_code: 0
      outputs: { candidates: 0, labels: [] }
      steps:
        draft: succeeded
        search: { status: succeeded, output_json: [] }
        dedupe: succeeded
        bail: { status: skipped, skip_reason: when_false }
        gate: succeeded
        create: succeeded
  - id: issue_draft                # the writer is told the whitelist, the judge sees the draft; wontfix is filtered out
    workflow: create_issue
    inputs: { description: "Crash on empty input" }
    stubs: stubs/create_issue.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs: { title: "Crash when the input list is empty", labels: [bug], candidates: 0 }
      steps: { gate: succeeded, create: succeeded }
  - id: issue_unlabelled           # an empty whitelist: the writer is told so, nothing is applied
    workflow: create_issue
    inputs: { description: "Crash on empty input", labels: [] }
    stubs: stubs/create_issue_unlabelled.yaml
    expect:
      status: succeeded
      outputs: { labels: [] }
  - id: issue_duplicate            # the judge names an existing issue: cancelled, nothing filed
    workflow: create_issue
    inputs: { description: "Crash on empty input" }
    stubs: stubs/create_issue_duplicate.yaml
    expect:
      status: cancelled
      exit_code: 4
      reason_contains: "duplicate of #12"
      steps:
        bail: succeeded
        gate: { status: skipped, skip_reason: when_false }
        create: skipped
  - id: issue_judge_lost           # the judge fails outright: no verdict, no gate, no issue
    workflow: create_issue
    inputs: { description: "Crash on empty input" }
    stubs: stubs/create_issue_judge_lost.yaml
    expect:
      status: failed
      exit_code: 1
      steps: { dedupe: failed, bail: skipped, gate: skipped, create: skipped }
  - id: validate_defaults          # no stubs: both sides simulated green → clean; the checkout is restored
    workflow: validate_pr
    inputs: { pr: 7 }
    expect:
      status: succeeded
      exit_code: 0
      outputs: { status: clean, newly_failing: [], newly_passing: [], base_exit: 0, head_exit: 0, recommendation: merge }
      steps:
        start: succeeded
        checkout_base: succeeded
        test_base: succeeded
        checkout_head: succeeded
        test_head: succeeded
        diff: succeeded
        restore: succeeded
        compare: { status: succeeded, output_json: { status: clean, newly_failing: [], newly_passing: [], base_exit: 0, head_exit: 0 } }
        judge: succeeded
  - id: validate_judge             # the judge is given the comparison and both transcripts
    workflow: validate_pr
    inputs: { pr: 7 }
    stubs: stubs/validate_pr.yaml
    expect:
      status: succeeded
      outputs: { status: clean, summary: "Both sides green; the PR introduces no test regression.", recommendation: merge }
  - id: validate_judge_lost        # no judge, no run — but the checkout was restored first
    workflow: validate_pr
    inputs: { pr: 7 }
    stubs: stubs/validate_pr_judge_lost.yaml
    expect:
      status: failed
      exit_code: 1
      steps: { compare: succeeded, restore: succeeded, judge: failed }
  - id: architect_empty            # a dry run simulates `areas` as [] → the nothing-to-survey path (exit 4)
    workflow: architect
    expect:
      status: cancelled
      exit_code: 4
      reason_contains: "nothing to survey"
      steps:
        map: succeeded
        areas: { status: succeeded, output_json: [] }
        nothing: succeeded
        survey: { status: skipped, skip_reason: when_false }
        report: skipped
        save: skipped
  - id: refactor_defaults          # no stubs: green baseline (simulated), one pass, shape only → committed (simulated)
    workflow: refactor_safely
    inputs: { goal: "split app.py into app/core.py and app/io.py", typecheck_command: "mypy ." }
    expect:
      status: succeeded
      exit_code: 0
      outputs: { attempts: 1, verdict: shape_only }
      steps:
        start: succeeded
        baseline_typecheck: succeeded
        baseline_tests: succeeded
        red_baseline: { status: skipped, skip_reason: when_false }
        plan: succeeded
        gate: succeeded
        work: succeeded
        "work[1]/edit": succeeded
        "work[1]/typecheck": succeeded
        "work[1]/check": succeeded
        "work[1]/give_up": { status: skipped, skip_reason: when_false }
        changes: succeeded
        nothing: { status: skipped, skip_reason: when_false }
        diff: succeeded
        behaviour: { status: skipped, skip_reason: when_false }
        commit: succeeded
  - id: refactor_clean             # every agent is told what the PRD says it must be told
    workflow: refactor_safely
    inputs: { goal: "split app.py into app/core.py and app/io.py", typecheck_command: "mypy ." }
    stubs: stubs/refactor_safely.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs:
        attempts: 1
        verdict: shape_only
        reasoning: "every hunk moves or renames; no condition, default or assertion changed"
  - id: refactor_behaviour         # the fresh reviewer flags a behaviour change: failed, not committed
    workflow: refactor_safely
    inputs: { goal: "split app.py into app/core.py and app/io.py", typecheck_command: "mypy ." }
    stubs: stubs/refactor_safely_behaviour.yaml
    expect:
      status: failed
      exit_code: 1
      reason_contains: "behaviour changed — nothing committed"
      steps:
        diff: succeeded
        behaviour: succeeded
        commit: { status: skipped, skip_reason: when_false }
  - id: refactor_reviewer_lost     # no verdict, no commit
    workflow: refactor_safely
    inputs: { goal: "split app.py into app/core.py and app/io.py", typecheck_command: "mypy ." }
    stubs: stubs/refactor_safely_reviewer_lost.yaml
    expect:
      status: failed
      exit_code: 1
      steps: { work: succeeded, diff: failed, behaviour: skipped, commit: skipped }
  # prd_to_pr — a dry run simulates every shell/python step green: `size_check` says ok,
  # `red` says red (the first enum value), the loop converges on its first pass, `guard` is [],
  # the gates auto-approve with an empty comment, and `pr` prints ''. Agent-decided branches
  # (open questions, a blocked implementer, a partial review, a lost reviewer) are scripted.
  - id: prd_defaults               # no stubs: schema-minimal answers, the whole graph on one pass
    workflow: prd_to_pr
    inputs: { prd: docs/prd.md, typecheck_command: "mypy src" }
    expect:
      status: succeeded
      exit_code: 0
      steps:
        read_prd: succeeded
        size_check: succeeded
        refuse: { status: skipped, skip_reason: when_false }
        start: succeeded
        setup: { status: skipped, skip_reason: when_false }
        baseline: succeeded
        red_baseline: { status: skipped, skip_reason: when_false }
        scout: succeeded
        clip: succeeded
        explore: succeeded
        "explore/scan": succeeded
        "explore/collect": succeeded
        plan: succeeded
        gate_plan: succeeded
        tests_first: succeeded
        red: { status: succeeded, output_json: { verdict: red, files: [], failing: [], already_green: [], exit_code: 0, output: "" } }
        vacuous: { status: skipped, skip_reason: when_false }
        commit_tests: succeeded
        build: succeeded
        "build[1]/implement": succeeded
        "build[1]/blocked_gate": { status: skipped, skip_reason: when_false }
        "build[1]/amend": { status: skipped, skip_reason: upstream_skipped }
        "build[1]/guard": { status: succeeded, output_json: [] }
        "build[1]/tampered": { status: skipped, skip_reason: when_false }
        "build[1]/typecheck": succeeded
        "build[1]/tests": succeeded
        "build[1]/give_up": { status: skipped, skip_reason: when_false }
        commit_impl: succeeded
        diff: succeeded
        review: succeeded
        gate_pr: succeeded
        pr: succeeded
      outputs:
        attempts: 1
        verdict: complete
        tests: []
        uncovered: []
        unrequested: []
        unresolved: []
        already_green: []
  - id: prd_scripted               # the four briefs pinned: planner, tester, implementer, reviewer
    workflow: prd_to_pr
    inputs: { prd: docs/prd.md, typecheck_command: "mypy src" }
    stubs: stubs/prd_to_pr.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs:
        attempts: 1
        verdict: complete
        covered: [R1]
        summary: "total() implemented as specified"
  - id: prd_unresolved             # an open question reaches the tester, the implementer and the reviewer
    workflow: prd_to_pr
    inputs: { prd: docs/prd.md, typecheck_command: "mypy src" }
    stubs: stubs/prd_to_pr_unresolved.yaml
    expect:
      status: succeeded
      exit_code: 0
      outputs:
        unresolved: [{ question: "GHCR or Docker Hub?", assumption: GHCR, affects: [R3] }]
  - id: prd_blocked                # blocked → the gate is auto-approved (amend the tests) → the implementer continues → PR
    workflow: prd_to_pr
    inputs: { prd: docs/prd.md, typecheck_command: "mypy src" }
    stubs: stubs/prd_to_pr_blocked.yaml
    expect:
      status: succeeded
      exit_code: 0
      steps:
        "build[1]/implement": succeeded
        "build[1]/blocked_gate": succeeded
        "build[1]/amend": succeeded
        "build[2]/implement": succeeded
        "build[2]/blocked_gate": { status: skipped, skip_reason: when_false }
        commit_impl: succeeded
        review: succeeded
        pr: succeeded
      outputs:
        attempts: 2
  - id: prd_partial                # a partial review annotates; the PR still opens
    workflow: prd_to_pr
    inputs: { prd: docs/prd.md, typecheck_command: "mypy src" }
    stubs: stubs/prd_to_pr_partial.yaml
    expect:
      status: succeeded
      exit_code: 0
      steps: { review: succeeded, gate_pr: succeeded, pr: succeeded }
      outputs:
        verdict: partial
        uncovered: [R2]
        unrequested: ["a --verbose flag"]
  - id: prd_reviewer_lost          # no review, no PR
    workflow: prd_to_pr
    inputs: { prd: docs/prd.md, typecheck_command: "mypy src" }
    stubs: stubs/prd_to_pr_reviewer_lost.yaml
    expect:
      status: failed
      exit_code: 1
      steps: { build: succeeded, review: failed, gate_pr: skipped, pr: skipped }
