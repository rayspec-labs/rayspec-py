# The implementer is blocked on attempt 1 (a test contradicts the PRD); the blocked_gate is
# auto-approved by the dry run (an empty comment = "amend the tests"), `amend` commits any test
# edits and moves the contract, and the implementer continues to `done` on attempt 2 → the loop
# converges and the PR opens. This is the v2 "amend the contract and continue" path.
defaults: { latency_ms: 0 }
steps:
  "build[*]/implement":
    sequence:
      - output: { status: blocked, question: "Should total([]) raise or return 0?", notes: "" }
      - output: { status: done, question: "", notes: "returns 0 after the amend" }
