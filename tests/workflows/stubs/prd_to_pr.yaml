# A dry run simulates every shell/python step green: the PRD reads as '' (`cat` is skipped), the
# size check says ok, `red` says red, the loop converges on its first pass and `pr` prints ''.
# The `expect:` blocks pin what each agent was asked — the scout (names the questions), the two
# explorers (answer them, read-only), the planner (uses their reports), the tester (fresh, write
# access, no schema), the implementer's first brief (structured) and the reviewer (structured).
defaults: { latency_ms: 0, usage: { input: 2500, output: 300 } }
steps:
  scout:
    output:
      questions: ["where does the sum live?", "what to reuse?"]
    expect:
      session: fresh
      access: read-only
      output_schema: true
      prompt_contains: ["name the 2 to", "questions"]
  "*inspect":
    output:
      question: "where does the sum live?"
      answer: "in app.py"
      files: [{ path: "app.py", why: "the module under test" }]
      reuse: [{ symbol: "sum", path: "builtins", why: "the stdlib does it" }]
      conventions: ["snake_case"]
      risks: ["none"]
    expect:
      access: read-only
      output_schema: true
  plan:
    output:
      summary: "add app.total"
      test_plan:
        - { requirement: "R1 — total(xs) returns the sum", tests: [test_total_sums, test_total_empty] }
      unresolved: []
    expect:
      session: fresh
      access: read-only
      output_schema: true
      prompt_contains: ["Plan how to implement this PRD test-first", "Explorer reports:"]
  tests_first:
    text: "Wrote test_total.py; it fails with AttributeError."
    expect:
      session: fresh
      access: workspace-write
      output_schema: false
      prompt_contains:
        - "Write the acceptance tests for this PRD — only tests, no implementation."
        - "- R1 — total(xs) returns the sum: test_total_sums; test_total_empty"
      not_contains: ["Answers given at the plan gate", "Open questions the planner could not resolve"]
  "build[*]/implement":
    output: { status: done, question: "", notes: "added total()" }
    expect:
      session: fresh
      access: workspace-write
      output_schema: true
      prompt_contains: ["Implement this PRD so that the acceptance tests pass", "fail right now"]
  review:
    output:
      covered: [R1]
      uncovered: []
      unrequested: []
      verdict: complete
      summary: "total() implemented as specified"
    expect:
      session: fresh
      access: read-only
      output_schema: true
      prompt_contains: ["For every requirement in the PRD say whether the diff covers it"]
